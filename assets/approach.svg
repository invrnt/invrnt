<svg xmlns="http://www.w3.org/2000/svg" width="896" height="289" viewBox="0 0 896 289" role="img" aria-label="How I work: architecture to delivery, AI-assisted engineering and domain knowledge."><title>How I work: architecture to delivery, AI-assisted engineering and domain knowledge.</title><rect width="896" height="289" rx="8" fill="#000000"/><text x="48" y="45" fill="#C9A96E" font-family="monospace" font-size="11" font-weight="400" letter-spacing="2">03 / HOW I WORK</text><text x="48" y="91" fill="#C9A96E" font-family="monospace" font-size="12" font-weight="400" letter-spacing="0">01</text><text x="87" y="91" fill="#F3F0E8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="0">Architecture to delivery</text><text x="87" y="119" fill="#B2AEA5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">I design, build and deploy complete products.</text><text x="48" y="158" fill="#C9A96E" font-family="monospace" font-size="12" font-weight="400" letter-spacing="0">02</text><text x="87" y="158" fill="#F3F0E8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="0">AI-assisted engineering</text><text x="87" y="186" fill="#B2AEA5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">I orchestrate agents and review the systems they help build.</text><text x="48" y="225" fill="#C9A96E" font-family="monospace" font-size="12" font-weight="400" letter-spacing="0">03</text><text x="87" y="225" fill="#F3F0E8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="0">Domain knowledge</text><text x="87" y="253" fill="#B2AEA5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">Accounting studies inform how I think about financial workflows.</text></svg>