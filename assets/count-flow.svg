<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%" role="img"
     aria-label="A spoken instruction enters a hidden engine of ledgers and pods, and a simple confirmation comes out." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>
  </defs>
  <style>
    .example { animation: examples 12s infinite; }
    .second { animation-delay: -8s; opacity: 0; }
    .third { animation-delay: -4s; opacity: 0; }
    .signal { animation: signal 2.4s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes examples {
      0%, 30% { opacity: 1; }
      33.333%, 96.667% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes signal { to { stroke-dashoffset: -24; } }
    @keyframes pulse { 50% { opacity: .4; } }
    @media (prefers-reduced-motion: reduce) {
      .example, .signal, .pulse { animation: none; }
      .second, .third { display: none; }
    }
  </style>
  <rect x="1" y="1" width="998" height="228" rx="18" fill="url(#cardbg)" stroke="#24221b"/>
  <g font-family="SFMono-Regular,Consolas,monospace">
    <!-- Each stage owns its text area; connectors sit in the gaps. -->
    <g fill="#C5AC66" font-size="13" letter-spacing="2">
      <text x="34" y="38">01 / YOU SAY</text>
      <text x="606" y="38" text-anchor="middle">02 / COUNT</text>
      <text x="877" y="38" text-anchor="middle">03 / DONE</text>
    </g>

    <rect x="30" y="58" width="392" height="130" rx="14" fill="#0c0c0c" stroke="#6d5926"/>
    <g fill="none" stroke="#F2D477" stroke-width="4" stroke-linecap="round">
      <path class="pulse" d="M52 83v8m9-13v18m9-23v28m9-22v16m9-12v8"/>
    </g>
    <g fill="#F2D477" font-size="19">
      <g class="example">
        <text x="50" y="133">“Lent Kevin $5,000</text>
        <text x="50" y="160">at 1.5% a month”</text>
      </g>
      <g class="example second">
        <text x="50" y="133">“Bought 10 shares</text>
        <text x="50" y="160">of KO”</text>
      </g>
      <g class="example third">
        <text x="50" y="133">“Fixed the Ontario rental,</text>
        <text x="50" y="160">$12k”</text>
      </g>
    </g>

    <g fill="none" stroke="#D4AF37" stroke-width="1.5">
      <path class="signal" d="M436 122h48M728 122h48" stroke-dasharray="4 8" opacity=".65"/>
      <path d="m479 117 5 5-5 5M771 117l5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="498" y="58" width="216" height="130" rx="14" fill="#0c0c0c" stroke="#D4AF37" stroke-width="1.2"/>
    <g fill="none" stroke="#D4AF37" stroke-width="1.2" opacity=".6">
      <path d="m574 87 32 17 32-17m-64 36 32-19 32 19m-64-36v36m64-36v36"/>
      <ellipse cx="606" cy="111" rx="48" ry="25"/>
    </g>
    <g fill="#F2D477">
      <circle cx="574" cy="87" r="3"/>
      <circle cx="638" cy="87" r="3"/>
      <circle cx="574" cy="123" r="3"/>
      <circle cx="638" cy="123" r="3"/>
      <circle class="pulse" cx="606" cy="104" r="5"/>
    </g>
    <g fill="#C5AC66" font-size="13" text-anchor="middle">
      <text x="606" y="157">LEDGERS · PODS</text>
      <text x="606" y="176">FX · CRON JOBS</text>
    </g>

    <rect x="790" y="58" width="174" height="130" rx="14" fill="#0c0c0c" stroke="#6d5926"/>
    <circle cx="877" cy="106" r="25" fill="none" stroke="#D4AF37" stroke-width="1.2"/>
    <path d="m864 106 9 9 18-20" fill="none" stroke="#F2D477" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="877" y="161" text-anchor="middle" font-size="15" letter-spacing="2" fill="#F2D477">BOOKED</text>
  </g>
</svg>
