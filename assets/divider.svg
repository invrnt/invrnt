<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="100%" role="img" aria-label="Decorative divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shimmer" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="42%" stop-color="#D4AF37" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#F2D477" stop-opacity="1"/>
      <stop offset="58%" stop-color="#D4AF37" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 2 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="14.0" x2="1200" y2="14.0" stroke="#D4AF37" stroke-width="1" opacity="0.18"/>
  <line x1="0" y1="14.0" x2="1200" y2="14.0" stroke="url(#shimmer)" stroke-width="1.4"/>
  <g transform="translate(600.0,14.0) rotate(45)">
    <rect x="-4" y="-4" width="8" height="8" fill="none" stroke="#D4AF37" stroke-width="1.2"/>
    <rect x="-1.6" y="-1.6" width="3.2" height="3.2" fill="#D4AF37"/>
  </g>
</svg>